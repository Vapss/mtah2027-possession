name: harness

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the pinned environment
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: .venv/bin/ruff check tools tests

      - name: Format check
        run: .venv/bin/ruff format --check tools tests

      - name: Tests
        # The gated match bundle is not in CI, so tests that need it skip themselves.
        run: .venv/bin/pytest -q

      - name: Data guard
        run: .venv/bin/python tools/guard_data.py

      - name: Build a submission end to end
        run: |
          make demo submission PY=.venv/bin/python
          .venv/bin/python evaluation/validate_submission.py submissions/submission.csv

      - name: Score and record
        run: make score PY=.venv/bin/python

      - name: Upload the scoreboard and ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard
          path: runs/
          if-no-files-found: warn
