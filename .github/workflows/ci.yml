name: harness

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the pinned environment from uv.lock
        # --locked fails if uv.lock is stale against pyproject.toml (--frozen would not notice).
        # Exact sync on purpose: CI builds the reproduction environment and nothing else.
        run: uv sync --locked

      - name: Lint
        run: .venv/bin/ruff check tools tests

      - name: Format check
        run: .venv/bin/ruff format --check tools tests

      - name: Tests
        # The gated match bundle is not in CI, so tests that need it skip themselves.
        run: .venv/bin/pytest -q

      - name: Data guard
        run: .venv/bin/python tools/guard_data.py

      - name: Build a submission end to end
        run: |
          make demo submission PY=.venv/bin/python
          .venv/bin/python evaluation/validate_submission.py submissions/submission.csv

      - name: Score and record
        run: make score PY=.venv/bin/python

      - name: Close the F0a chain
        run: make f0a PY=.venv/bin/python

      - name: Upload the scoreboard and ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard
          path: runs/
          if-no-files-found: warn

  graph:
    # The code graph is optional for the harness; its contract is not. This job builds it and
    # checks the two things that fail silently: the output becoming committable, and a report
    # that describes a different commit than the one under test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install graphify
        run: |
          uv tool install graphifyy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the code graph and check it cannot be committed
        run: make graph-check PY=python3
